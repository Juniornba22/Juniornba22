name: Android Code Analysis

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Tornar gradlew executável
        run: chmod +x ./EVANGELISTASISTEMAS/gradlew

      - name: Executar Lint
        run: ./EVANGELISTASISTEMAS/gradlew lintDebug

      - name: Upload do Relatório
        uses: actions/upload-artifact@v4
        with:
          name: Relatorio-Lint
          path: EVANGELISTASISTEMAS/app/build/reports/lint-results-debug.html
